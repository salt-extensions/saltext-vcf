# Exec-only bridge via Salt's generic `module.run` state — no dedicated
# `vcf_*` state exists for vCenter SSO groups yet. Guarded with `unless`
# against `groups_get_or_none` for real idempotency (unlike most module.run
# bridges in this tree, this one IS safe to re-run).
group:
  name: vcf-automation-operators
  domain: vsphere.local
  description: Automation service accounts
