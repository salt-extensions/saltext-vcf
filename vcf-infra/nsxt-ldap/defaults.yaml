# NSX Policy API LDAP identity source. Replace example connection values before applying.
provider:
  name: corp-ldap
  resource_type: ActiveDirectoryIdentitySource
  base_dn: dc=corp,dc=example,dc=test
  domain_name: corp.example.test
  ldap_servers:
    - url: ldaps://ldap.corp.example.test:636
      bind_identity: CN=svc-nsx,CN=Users,DC=corp,DC=example,DC=test
      password: changeme
