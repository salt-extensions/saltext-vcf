api_version: saltext.vcf/v1
kind: KBResolution

metadata:
  id: kb-317537
  title: Configure Network Time Protocol (NTP) on an ESXi host
  description: >-
    Configure approved NTP servers and NTP service settings on selected ESXi
    hosts through the reusable VCF NTP Salt state.
  status: verified
  maturity: production
  maintainers:
    - vcf-config-management
  tags:
    - esxi
    - ntp
    - time-synchronization
    - clock-skew

kb:
  provider: broadcom
  id: "317537"
  title: Configure Network Time Protocol (NTP) on an ESXi host
  url: https://knowledge.broadcom.com/external/article/317537/configuring-network-time-protocol-ntp-on.html
  last_verified: "2026-08-03"

applicability:
  products:
    - VMware vSphere ESXi
  components:
    - ESXi
  versions:
    - 6.x
    - 7.x
    - 8.x
    - 9.x
  symptoms:
    - ESXi host time is not synchronized
    - Clock skew or time drift is detected
    - NTP service is stopped or not configured to start with the host
  error_patterns:
    - time not synchronized
    - clock skew
    - NTP service not running
    - NTP server unreachable
  prerequisites:
    - Approved customer NTP values exist for the selected environment and version.
    - The target group contains only the intended ESXi minions.
    - Target minions are online in RaaS.
    - NTP servers are reachable from the selected ESXi hosts.

execution:
  state: vcf-infra.ntp.ntp
  resource: ntp
  entrypoint: ntp.sls
  description: Apply the approved NTP servers and NTP service settings.
  values_schema: solutions/schemas/ntp-values.schema.yaml
  values_required: true
  dry_run_supported: true
  reboot_required: false
  service_restart_required: true

risk:
  level: medium
  impact: >-
    Incorrect or unreachable NTP servers can leave ESXi hosts unsynchronized
    and may affect authentication, certificates, logs, and event ordering.
  requires_confirmation: true
  rollback_supported: true
  rollback_state: vcf-infra.ntp.ntp
